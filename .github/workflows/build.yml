name: Build

# 每次推送到 master 自动编译、打包并发布 Release；
# PR 只编译验证，不发布。
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: 编译（Release）
        # 游戏引用程序集来自仓库内 Managed 目录（Cities: Skylines 1.21.x）；
        # /restore 还原 PackageReference；SkipDeploy 关闭本地游戏目录部署。
        run: msbuild ImprovedPublicTransport.sln /nologo /m /restore /p:Configuration=Release /p:SkipDeploy=true

      - name: 打包
        shell: pwsh
        run: |
          $out = "package/ImprovedPublicTransport3"
          New-Item -ItemType Directory -Force $out | Out-Null

          Copy-Item bin/Release/ImprovedPublicTransport3.dll $out
          Copy-Item bin/Release/CitiesHarmony.API.dll $out
          Copy-Item -Recurse bin/Release/Translations $out/Translations
          Copy-Item -Recurse bin/Release/Resources $out/Resources
          Copy-Item README.md $out

          Compress-Archive -Path $out -DestinationPath "package/ImprovedPublicTransport3.zip" -Force

      - name: 读取模组版本号
        id: mod_version
        shell: pwsh
        run: |
          $version = (Select-String -Path ImprovedPublicTransportMod.cs -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $version) { $version = "0.0" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ImprovedPublicTransport3-${{ github.run_number }}
          path: package/ImprovedPublicTransport3.zip

      - name: 发布 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.mod_version.outputs.version }}-${{ github.run_number }}
          name: Improved Public Transport 3 ${{ steps.mod_version.outputs.version }} (build ${{ github.run_number }})
          files: package/ImprovedPublicTransport3.zip
          generate_release_notes: true
